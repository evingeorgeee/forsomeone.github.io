    <div class="music">
        <audio id="song">
            <p>Your Song Name</p>
            <source src="6.mp3" type="audio/mpeg">
        </audio>
        <button onclick="togglePlay()">Lets play Heather!!</button>

        <script>
        function togglePlay() {
